name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Check out the independently licensed Cloudly source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sheno4/Caustica
          ref: 25403ebe4f395e1460f4f04b471c99dbd8be93c9
          path: .cloudly-runtime
          persist-credentials: false
      # Public runners have no game-derived shaders or matching custom runtime.
      - name: Compile Java sources (no native or rendering validation)
        run: '& "$env:GITHUB_WORKSPACE\gradlew.bat" compileJava -x setupRuntime -x test -PcloudlyRuntimeProject=.cloudly-runtime'

  legacy-interop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile and test legacy OpenGL bridge
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE\forge-1.12.2\scripts\build-bridge.ps1" -JdkPath $env:JAVA_HOME'

  forge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "8"
      - name: Build and test Forge 1.12.2
        working-directory: forge-1.12.2
        run: '.\gradlew.bat build test diagnosticJar'
