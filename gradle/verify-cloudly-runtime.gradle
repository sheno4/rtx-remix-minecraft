// Read the export table without loading a graphics DLL into the build process.
ext.verifyCloudlyRuntime = { File dll, String arch ->
    if (!dll.isFile()) {
        throw new GradleException("Missing AC8 native runtime: ${dll}")
    }
    new RandomAccessFile(dll, 'r').withCloseable { binary ->
        def requireBytes = { offset, length ->
            if (offset < 0 || length < 0 || offset > binary.length() - length) {
                throw new GradleException("Invalid PE data in AC8 native runtime: ${dll}")
            }
        }
        def uint16 = { long offset ->
            requireBytes(offset, 2)
            binary.seek(offset)
            return Short.toUnsignedInt(Short.reverseBytes(binary.readShort()))
        }
        def uint32 = { long offset ->
            requireBytes(offset, 4)
            binary.seek(offset)
            return Integer.toUnsignedLong(Integer.reverseBytes(binary.readInt()))
        }
        def cString = { long offset ->
            def value = new StringBuilder()
            for (int index = 0; index < 256; index++) {
                requireBytes(offset + index, 1)
                binary.seek(offset + index)
                int next = binary.readUnsignedByte()
                if (next == 0) return value.toString()
                value.append((char) next)
            }
            throw new GradleException("Invalid PE export name in AC8 native runtime: ${dll}")
        }

        if (uint16(0) != 0x5a4d) {
            throw new GradleException("AC8 native runtime is not a PE DLL: ${dll}")
        }
        long pe = uint32(0x3c)
        if (uint32(pe) != 0x4550) {
            throw new GradleException("AC8 native runtime has an invalid PE header: ${dll}")
        }
        int expectedMachine = [win64: 0x8664, arm64: 0xaa64][arch]
        if (uint16(pe + 4) != expectedMachine) {
            throw new GradleException("AC8 native runtime does not match target architecture ${arch}: ${dll}")
        }
        int sectionCount = uint16(pe + 6)
        int optionalSize = uint16(pe + 20)
        long optional = pe + 24
        if (sectionCount < 1 || sectionCount > 96 || optionalSize < 120 || uint16(optional) != 0x20b) {
            throw new GradleException("AC8 native runtime requires a valid 64-bit PE image: ${dll}")
        }
        long headerSize = uint32(optional + 60)
        long exportRva = uint32(optional + 112)
        long exportSize = uint32(optional + 116)
        if (uint32(optional + 108) < 1 || exportRva == 0 || exportSize < 40) {
            throw new GradleException("AC8 native runtime has no export table: ${dll}")
        }
        def sections = (0..<sectionCount).collect { int index ->
            long section = optional + optionalSize + index * 40
            [rva: uint32(section + 12), rawSize: uint32(section + 16), rawOffset: uint32(section + 20)]
        }
        def fileOffset = { rva, size ->
            if (rva < headerSize && size <= headerSize - rva) {
                requireBytes(rva, size)
                return rva
            }
            def section = sections.find { candidate ->
                rva >= candidate.rva && rva - candidate.rva <= candidate.rawSize - size
            }
            if (section == null) {
                throw new GradleException("Unmapped PE export in AC8 native runtime: ${dll}")
            }
            long offset = section.rawOffset + rva - section.rva
            requireBytes(offset, size)
            return offset
        }
        long exports = fileOffset(exportRva, 40)
        long functionCount = uint32(exports + 20)
        long nameCount = uint32(exports + 24)
        if (functionCount < 1 || functionCount > 65536 || nameCount > 65536) {
            throw new GradleException("Invalid PE export count in AC8 native runtime: ${dll}")
        }
        long functions = fileOffset(uint32(exports + 28), functionCount * 4)
        long names = fileOffset(uint32(exports + 32), nameCount * 4)
        long ordinals = fileOffset(uint32(exports + 36), nameCount * 2)
        def required = ['remixapi_RegisterCloudly', 'remixapi_SetCloudlyFrameData',
                        'remixapi_CloudlyCapabilities', 'remixapi_CloudlyCapabilityBits'] as Set
        def found = [:]
        for (long index = 0; index < nameCount; index++) {
            String name = cString(fileOffset(uint32(names + index * 4), 1))
            if (!required.contains(name)) continue
            int ordinal = uint16(ordinals + index * 2)
            if (ordinal >= functionCount) {
                throw new GradleException("Invalid Cloudly export ordinal: ${dll}")
            }
            long rva = uint32(functions + ordinal * 4)
            if (rva == 0 || (rva >= exportRva && rva - exportRva < exportSize)) {
                throw new GradleException("Cloudly exports must be implemented by this runtime: ${dll}")
            }
            fileOffset(rva, 1)
            found[name] = rva
        }
        def missing = required.findAll { !found.containsKey(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Runtime ${dll} is missing the AC8 native integration (${missing.join(', ')}). " +
                    'Stage a matching Cloudly-enabled runtime; the stock Remix SDK cannot render this branch.')
        }
        long capabilities = uint32(fileOffset(found.remixapi_CloudlyCapabilityBits, 4))
        if ((capabilities & 7) != 7) {
            throw new GradleException("Runtime ${dll} does not include all AC8 capabilities (bits=${capabilities}). " +
                    'Rebuild it with the original private shader adapter before staging or packaging.')
        }
    }
}
