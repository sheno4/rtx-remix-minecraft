pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'rtx-remix-renderer'

// The LGPL renderer is an independently replaceable, separately versioned
// checkout ignored by this host repository. See docs/AC8_CLOUDS.md.
def cloudlyDirectory = providers.gradleProperty('cloudlyRuntimeProject')
        .orElse('cloudly-runtime').get()
if (!file(cloudlyDirectory).isDirectory()) {
    throw new GradleException("AC8 Cloudly source is missing: ${cloudlyDirectory}. " +
            'See docs/AC8_CLOUDS.md or set -PcloudlyRuntimeProject=<directory>.')
}
includeBuild(cloudlyDirectory)
